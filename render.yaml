# ─────────────────────────────────────────────────────────────────────────────
#  Health AI — SRMNH  →  Render.com (Free Tier)
#
#  Deploy with:
#    1. Push this repo to GitHub
#    2. Go to https://dashboard.render.com → New → Blueprint
#    3. Connect your GitHub repo — Render reads this file automatically
#
#  Or manual deploy:
#    1. New → Web Service → Connect repo
#    2. Build Command:  pip install -r requirements.txt
#    3. Start Command:  python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
#    4. Set env var:    DATA_DIR=/tmp/health-ai-data
#
#  Free tier: 750 hrs/month, sleeps after 15 min idle, 512 MB RAM.
#  SQLite is used by default (re-seeds on cold start). Data is ephemeral.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: health-ai
    runtime: image
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /tmp/health-ai-data
      - key: AI_RECOMMENDATIONS_ENABLED
        value: "false"
      # To use PostgreSQL instead of SQLite, uncomment below and create
      # a Render PostgreSQL instance (free for 90 days):
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: health-ai-db
      #     property: connectionString
    autoDeploy: true
