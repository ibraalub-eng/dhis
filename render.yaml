#  Health AI — SRMNH  →  Render.com (Free Tier)
#
#  Deploy with:
#    1. Push this repo to GitHub
#    2. Go to https://dashboard.render.com → New → Blueprint
#    3. Connect your GitHub repo — Render reads this file automatically
#
#  Free tier: 750 hrs/month, sleeps after 15 min idle, 512 MB RAM.
#  PostgreSQL is provisioned automatically and persists across restarts.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: health-ai-db
    plan: free
    databaseName: health_ai
    user: health_ai_user

services:
  - type: web
    name: health-ai
    runtime: image
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /tmp/health-ai-data
      - key: AI_RECOMMENDATIONS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: health-ai-db
          property: connectionString
    autoDeploy: true
