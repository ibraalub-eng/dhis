<div class="smart-analytics-tab" dir="rtl" style="padding:0.5rem 0.25rem;max-width:1200px;margin:0 auto;position:relative;">

  <!-- ═══ Top bar: title + refresh ═══ -->
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.8rem;margin-bottom:1rem;">
    <div>
      <h2 style="margin:0;color:var(--accent-blue);font-size:1.15rem;">🔮 <span data-i18n="Smart Forecast">التنبؤ الذكي</span></h2>
      <div style="font-size:0.72rem;color:var(--text-secondary);margin-top:0.2rem;" data-i18n="Forecast first, act early">تنبؤ أولاً، تدخّل مبكراً</div>
    </div>
    <button id="smart-forecast-refresh" class="btn btn-sm" data-i18n="Refresh">تحديث</button>
  </div>

  <!-- ═══ Context bar: month + horizon + status ═══ -->
  <div class="smart-context-bar">
    <div style="display:flex;gap:0.8rem;align-items:flex-end;flex-wrap:wrap;width:100%;">
      <div>
        <label style="font-weight:600;font-size:0.82rem;display:block;margin-bottom:0.25rem;color:var(--accent-purple);" data-i18n="Month:">الشهر:</label>
        <select id="smart-forecast-month-select" style="padding:0.45rem 0.6rem;border-radius:6px;border:1px solid var(--border-default);min-width:130px;font-size:0.85rem;background:var(--bg-input);"></select>
      </div>
      <div>
        <label for="smart-horizon-select" style="font-weight:600;font-size:0.82rem;display:block;margin-bottom:0.25rem;color:var(--accent-purple);"><span data-i18n="Forecast horizon">أفق التنبؤ</span></label>
        <select id="smart-horizon-select" class="smart-select" style="max-width:180px;">
          <option value="1" data-i18n="Next month (m+1)">الشهر التالي (m+1)</option>
          <option value="3" data-i18n="Within 3 months">خلال 3 أشهر</option>
          <option value="6" data-i18n="Within 6 months">خلال 6 أشهر</option>
          <option value="9" data-i18n="Within 9 months">خلال 9 أشهر</option>
          <option value="12" data-i18n="Within 12 months">خلال 12 شهراً</option>
        </select>
      </div>
      <span id="smart-forecast-status" style="font-size:0.8rem;color:var(--text-secondary);align-self:flex-end;"></span>
    </div>
  </div>

  <!-- ═══ Forecasts (moved from the Smart Analytics screen) ═══ -->
  <div class="smart-section-card open">
    <div class="smart-section-header" data-smart-collapsible="smart-forecast-section">
      <span>🔮 <span data-i18n="Forecasts">التنبؤات</span> — <span data-i18n="XGBoost and walk-forward">XGBoost والتحقق الزمني</span></span>
      <span class="smart-toggle-icon">▾</span>
    </div>
    <div id="smart-forecast-section" class="smart-section-body">
      <div class="smart-loader" data-smart-loader="xgboost"><span data-i18n="Computing...">جاري المعالجة...</span></div>
      <div class="smart-error-banner" data-smart-error="xgboost" role="alert"></div>
      <div class="smart-empty-state" data-smart-empty="xgboost"></div>
      <div id="smart-xgboost-predictions"></div>
      <div id="smart-forecast-timeline" style="min-height:280px;"></div>
      <div id="smart-forecast-accuracy"></div>
      <div id="smart-forecast-tracking"></div>
      <div id="smart-forecast-signals"></div>
      <div id="smart-indicator-forecast">
        <div style="display:flex;align-items:center;gap:0.6rem;margin:0.6rem 0 0.5rem;flex-wrap:wrap;">
          <label for="smart-indicator-select" style="font-size:0.82rem;color:var(--text-secondary);"><span data-i18n="Indicator forecast">تنبؤ مؤشر</span></label>
          <select id="smart-indicator-select" class="smart-select" style="max-width:220px;"></select>
          <label for="smart-indicator-hospitals" style="font-size:0.82rem;color:var(--text-secondary);"><span data-i18n="Select hospitals to forecast">اختر المستشفيات (متعدد)</span></label>
          <select id="smart-indicator-hospitals" class="smart-select" multiple size="4" style="min-width:240px;max-width:320px;"></select>
          <button id="smart-indicator-forecast-run" class="btn btn-sm" data-i18n="Forecast">تنبؤ</button>
        </div>
        <div id="smart-indicator-forecast-output"></div>
      </div>
      <div id="smart-walk-forward" style="min-height:220px;"></div>
      <div id="smart-predicted-scatter" style="height:260px;"></div>
    </div>
  </div>

  <!-- ═══ Single-hospital forecast (moved from the analytics hospital mode) ═══ -->
  <div class="smart-section-card open">
    <div class="smart-section-header" data-smart-collapsible="smart-hospital-forecast-section">
      <span>🏥 <span data-i18n="Hospital forecast">تنبؤ مستشفى</span> — <span data-i18n="Leading indicators and expected trend">المؤشرات القيادية والاتجاه المتوقع</span></span>
      <span class="smart-toggle-icon">▾</span>
    </div>
    <div id="smart-hospital-forecast-section" class="smart-section-body">
      <div class="smart-loader" data-smart-loader="hospital-forecast"><span data-i18n="Computing...">جاري المعالجة...</span></div>
      <div class="smart-error-banner" data-smart-error="hospital-forecast" role="alert"></div>
      <div class="smart-empty-state" data-smart-empty="hospital-forecast"></div>
      <div style="display:flex;align-items:center;gap:0.6rem;margin:0.2rem 0 0.8rem;flex-wrap:wrap;">
        <label for="smart-forecast-hospital-select" style="font-size:0.82rem;color:var(--text-secondary);"><span data-i18n="Hospital">مستشفى</span></label>
        <select id="smart-forecast-hospital-select" class="smart-select" style="min-width:240px;max-width:340px;"></select>
      </div>
      <div id="smart-hospital-forecast"></div>
    </div>
  </div>

  <!-- Disclaimer -->
  <div class="smart-disclaimer">
    <span style="font-size:1.1rem;">&#9888;&#65039;</span>
    <span id="smart-forecast-disclaimer" class="smart-disclaimer-text" data-i18n="Results are based on registered hospital data only. Treat them as preliminary information, not final decisions.">النتائج مبنية على بيانات المستشفيات المسجلة فقط. يجب تفسيرها كمعلومات أولية وليست قرارات نهائية.</span>
  </div>
</div>
