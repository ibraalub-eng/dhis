                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
                        <div>
                            <h2 style="margin:0;">Indicator Tree</h2>
                            <span style="font-size:0.82rem;color:#888;">Browse indicators hierarchically with values</span>
                        </div>
                    </div>
                    <div class="card" style="padding:0.6rem 0.8rem;">
                        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.4rem;">
                            <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                                <label style="font-size:0.75rem;color:#666;">Hospital:</label>
                                <select id="treeHospitalSelect" style="font-size:0.78rem;padding:0.2rem 0.4rem;"></select>
                                <label style="font-size:0.75rem;color:#666;">Month:</label>
                                <select id="treeMonthSelect" style="font-size:0.78rem;padding:0.2rem 0.4rem;"></select>
                                <button class="btn btn-sm" onclick="loadIndicatorTree()" style="font-size:0.75rem;padding:0.2rem 0.6rem;">Load Tree</button>
                                <button class="btn btn-sm btn-outline" id="treeSaveBtn" onclick="saveTreeConfig()" style="font-size:0.72rem;padding:0.2rem 0.5rem;display:none;">Save Config</button>
                            </div>
                            <div style="display:flex;align-items:center;gap:0.4rem;">
                                <span id="treeSummary" style="font-size:0.75rem;color:#888;"></span>
                                <span id="treeLoading" class="hidden" style="font-size:0.75rem;color:#888;"><span class="spinner"></span></span>
                            </div>
                        </div>
                        <div style="display:flex;gap:0.4rem;margin-bottom:0.4rem;">
                            <button class="btn btn-sm btn-outline" onclick="expandAllTree()" style="padding:0.2rem 0.5rem;font-size:0.72rem;">Expand All</button>
                            <button class="btn btn-sm btn-outline" onclick="collapseAllTree()" style="padding:0.2rem 0.5rem;font-size:0.72rem;">Collapse All</button>
                        </div>
                        <!-- Month Enable/Disable Checkboxes -->
                        <div style="background:#f8f9fa;padding:0.6rem 0.8rem;border-radius:6px;margin-bottom:0.6rem;">
                            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;">
                                <strong style="font-size:0.8rem;">Analysis Months:</strong>
                                <button class="btn btn-sm btn-outline" onclick="toggleAllMonths(true)" style="font-size:0.68rem;padding:0.1rem 0.4rem;">Enable All</button>
                                <button class="btn btn-sm btn-outline" onclick="toggleAllMonths(false)" style="font-size:0.68rem;padding:0.1rem 0.4rem;">Disable All</button>
                                <span id="monthSaveStatus" style="font-size:0.72rem;color:#888;"></span>
                            </div>
                            <div id="monthCheckboxes" style="display:flex;flex-wrap:wrap;gap:0.6rem;font-size:0.78rem;"></div>
                        </div>
                        <div id="treeContainer" style="max-height:600px;overflow-y:auto;font-size:0.85rem;border:1px solid #e0e0e0;border-radius:4px;padding:0.5rem;">
                            <div style="text-align:center;padding:2rem 1rem;color:#888;">
                                <div style="font-size:1.5rem;margin-bottom:0.3rem;opacity:0.3;">&#127795;</div>
                                <p style="margin:0;font-size:0.82rem;">Select a hospital and month, then click Load Tree.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
